<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>頂樓地標導覽 AR WebApp</title>
    
    <!-- 使用高度優化且相容性最佳的 A-Frame 與 AR.js 組合 -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
        }
        #ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 999;
            text-align: center;
            display: none;
        }
        #ui-overlay h2 { margin: 0 0 5px 0; color: #333; font-size: 1.2rem; }
        #ui-overlay p { margin: 0; color: #666; font-size: 0.9rem; line-height: 1.4; }
        
        #permission-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        #permission-btn {
            padding: 15px 32px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,122,255,0.4);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- 啟動引導遮罩 -->
    <div id="permission-container">
        <h3>頂樓導覽 AR 系統</h3>
        <p>請點擊下方按鈕以啟動相機與定位羅盤</p>
        <button id="permission-btn" onclick="initAR()">開啟頂樓導覽</button>
    </div>

    <!-- AR 場景：交給 AR.js 內建機制去初始化相機，不再手動干預 -->
    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-camera gps-camera rotation-reader></a-camera>
        
    </a-scene>

    <div id="ui-overlay">
        <h2 id="building-name">建築物名稱</h2>
        <p id="building-desc">描述內容...</p>
    </div>

    <script>
        const buildingsData = [
            { name: "東側台北101大樓", lat: 25.033964, lng: 121.564468, desc: "曾為世界第一高樓，結構設計融合傳統與現代。" },
            { name: "北側新光摩天大樓", lat: 25.046536, lng: 121.515277, desc: "位於站前商圈的核心地標，頂樓設有景觀展望台。" },
            { name: "遠方體育巨蛋", lat: 25.044147, lng: 121.560647, desc: "大型綜合多功能體育館，可容納達 4 萬名觀眾。" }
        ];

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        async function initAR() {
            const btn = document.getElementById('permission-btn');
            btn.innerText = "正在初始化...";

            // 1. 如果是 iOS，只在第一時間向系統討取最嚴格的羅盤權限，完全不碰相機
            if (isIOS && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response !== 'granted') {
                        alert('需要羅盤權限才能精確定位地標方向！');
                        btn.innerText = "重新開啟頂樓導覽";
                        return;
                    }
                } catch (e) {
                    alert('羅盤授權失敗: ' + e);
                    btn.innerText = "重新開啟頂樓導覽";
                    return;
                }
            }

            // 2. 羅盤過關（或非 iOS 裝置）後，直接隱藏遮罩，露出下方的 a-scene
            document.getElementById('permission-container').style.display = 'none';
            
            // 3. 這一行至關重要：強迫瀏覽器重新佈局，此時底層的 AR.js 就會乾淨、無衝突地直接喚醒相機
            window.dispatchEvent(new Event('resize'));
            
            // 4. 載入 3D 地標文字
            loadLandmarks();
        }

        function loadLandmarks() {
            const container = document.getElementById('landmark-container');
            if (!container) return;

            container.innerHTML = "";

            buildingsData.forEach((bld) => {
                const entity = document.createElement('a-entity');
                entity.setAttribute('gps-entity-place', `latitude: ${bld.lat}; longitude: ${bld.lng};`);
                
                entity.setAttribute('text', {
                    value: bld.name,
                    align: 'center',
                    color: '#FFFFFF',
                    width: 8,
                    backgroundColor: '#FF3B30',
                    backgroundPadding: 0.3,
                    wrapCount: 12
                });
                
                entity.setAttribute('look-at', '[gps-camera]');
                entity.setAttribute('scale', '6 6 6'); // 稍微放大字體

                entity.addEventListener('click', () => {
                    showBuildingDetails(bld.name, bld.desc);
                });

                container.appendChild(entity);
            });
            console.log("AR 地標載入完成！");
        }

        function showBuildingDetails(name, desc) {
            document.getElementById('building-name').innerText = name;
            document.getElementById('building-desc').innerText = desc;
            const overlay = document.getElementById('ui-overlay');
            overlay.style.display = 'block';
            overlay.onclick = () => { overlay.style.display = 'none'; };
        }
    </script>
</body>
</html>
