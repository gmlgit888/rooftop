<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>頂樓地標導覽 AR WebApp</title>
    
    <!-- 使用對 iOS 相容性更好的 A-Frame 與 AR.js 版本 -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000; /* 防止白屏，先給黑色背景 */
        }
        #ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 999;
            text-align: center;
            display: none;
        }
        #ui-overlay h2 { margin: 0 0 5px 0; color: #333; font-size: 1.2rem; }
        #ui-overlay p { margin: 0; color: #666; font-size: 0.9rem; line-height: 1.4; }
        
        #permission-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        #permission-btn {
            padding: 15px 32px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,122,255,0.4);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- 改良遮罩：強制引導使用者進行首次點擊互動 -->
    <div id="permission-container">
        <h3>頂樓導覽 AR 系統</h3>
        <p>請點擊下方按鈕以授權相機與定位羅盤</p>
        <button id="permission-btn" onclick="initAR()">開啟頂樓導覽</button>
    </div>

    <!-- AR 場景：加入 videoInjected 確保相機不提前偷跑 -->
    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; sourceWidth:1280; sourceHeight:720; displayWidth:1280; displayHeight:720; debugUIEnabled: false; videoInjected: true;">
        
        <a-camera gps-camera rotation-reader></a-camera>
        
    </a-scene>

    <div id="ui-overlay">
        <h2 id="building-name">建築物名稱</h2>
        <p id="building-desc">描述內容...</p>
    </div>

    <script>
        const buildingsData = [
            { name: "東側台北101大樓", lat: 25.033964, lng: 121.564468, desc: "曾為世界第一高樓，結構設計融合傳統與現代。" },
            { name: "北側新光摩天大樓", lat: 25.046536, lng: 121.515277, desc: "位於站前商圈的核心地標，頂樓設有景觀展望台。" },
            { name: "遠方體育巨蛋", lat: 25.044147, lng: 121.560647, desc: "大型綜合多功能體育館，可容納達 4 萬名觀眾。" }
        ];

        async function initAR() {
            // 1. 第一步：在使用者點擊的當下，主動向 iOS 申請相機權限，破解 Safari 的封鎖
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                
                // 成功拿到相機流後，先關閉它，讓給 AR.js 接管
                stream.getTracks().forEach(track => track.stop());
            } catch (err) {
                alert("無法取得相機權限，請至 iOS 設定中允許 Safari 使用相機。\n錯誤資訊: " + err.message);
                return;
            }

            // 2. 第二步：處理 iOS 羅盤權限
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response === 'granted') {
                        startARSystem();
                    } else {
                        alert('需要羅盤權限才能精確定位地標方向！');
                    }
                } catch (e) {
                    alert('羅盤授權出錯: ' + e);
                }
            } else {
                // Android 或非 iOS 系統直接啟動
                startARSystem();
            }
        }

        function startARSystem() {
            // 隱藏權限遮罩
            document.getElementById('permission-container').style.display = 'none';
            
            // 3. 第三步：手動觸發 AR.js 重新調整相機大小與初始化，解決全黑空白問題
            window.dispatchEvent(new Event('resize'));
            
            loadLandmarks();
        }

        function loadLandmarks() {
            const container = document.getElementById('landmark-container');

            buildingsData.forEach((bld) => {
                const entity = document.createElement('a-entity');
                entity.setAttribute('gps-entity-place', `latitude: ${bld.lat}; longitude: ${bld.lng};`);
                
                // 為了在手機上更容易看清，調整了字體大小與縮放
                entity.setAttribute('text', {
                    value: bld.name,
                    align: 'center',
                    color: '#FFFFFF',
                    width: 8,
                    backgroundColor: '#FF3B30', /* 改用更醒目的紅色標籤 */
                    backgroundPadding: 0.3,
                    wrapCount: 12
                });
                
                entity.setAttribute('look-at', '[gps-camera]');
                entity.setAttribute('scale', '5 5 5');

                entity.addEventListener('click', () => {
                    showBuildingDetails(bld.name, bld.desc);
                });

                container.appendChild(entity);
            });
        }

        function showBuildingDetails(name, desc) {
            document.getElementById('building-name').innerText = name;
            document.getElementById('building-desc').innerText = desc;
            const overlay = document.getElementById('ui-overlay');
            overlay.style.display = 'block';
            overlay.onclick = () => { overlay.style.display = 'none'; };
        }
    </script>
</body>
</html>
