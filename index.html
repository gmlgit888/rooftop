<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>頂樓地標導覽 AR WebApp</title>
    
    <!-- 使用穩定的 A-Frame 與 AR.js 版本 -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000;
        }
        #ui-overlay {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 999;
            text-align: center;
            display: none;
        }
        #ui-overlay h2 { margin: 0 0 5px 0; color: #333; font-size: 1.2rem; }
        #ui-overlay p { margin: 0; color: #666; font-size: 0.9rem; line-height: 1.4; }
        
        #permission-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        #permission-btn {
            padding: 15px 32px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,122,255,0.4);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- 權限與啟動遮罩 -->
    <div id="permission-container">
        <h3>頂樓導覽 AR 系統</h3>
        <p>請點擊下方按鈕以授權相機與定位羅盤</p>
        <button id="permission-btn" onclick="initAR()">開啟頂樓導覽</button>
    </div>

    <!-- AR 場景 -->
    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; videoInjected: true;">
        
        <a-camera gps-camera rotation-reader></a-camera>
        
        <!-- 確保這個 ID 在 JavaScript 呼叫前就存在於 HTML 中 -->
        
    </a-scene>

    <div id="ui-overlay">
        <h2 id="building-name">建築物名稱</h2>
        <p id="building-desc">描述內容...</p>
    </div>

    <script>
        // 預設地標資料
        const buildingsData = [
            { name: "東側台北101大樓", lat: 25.033964, lng: 121.564468, desc: "曾為世界第一高樓，結構設計融合傳統與現代。" },
            { name: "北側新光摩天大樓", lat: 25.046536, lng: 121.515277, desc: "位於站前商圈的核心地標，頂樓設有景觀展望台。" },
            { name: "遠方體育巨蛋", lat: 25.044147, lng: 121.560647, desc: "大型綜合多功能體育館，可容納達 4 萬名觀眾。" }
        ];

        // 判斷是否為 iOS 裝置
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        async function initAR() {
            const btn = document.getElementById('permission-btn');
            btn.innerText = "處理中...";

            // 1. 優先處理 iOS 特有的羅盤權限
            if (isIOS && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceOrientationEvent.requestPermission();
                    if (response !== 'granted') {
                        alert('需要羅盤權限才能精確定位地標方向！');
                        btn.innerText = "重新開啟頂樓導覽";
                        return;
                    }
                } catch (e) {
                    alert('羅盤授權出錯: ' + e);
                    btn.innerText = "重新開啟頂樓導覽";
                    return;
                }
            }

            // 2. 請求相機權限
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                // 成功獲取後暫時關閉，釋放給 AR.js
                stream.getTracks().forEach(track => track.stop());
                
                // 3. 權限皆允許，啟動系統
                startARSystem();

            } catch (err) {
                // 根據平台顯示正確的提示文字
                if (isIOS) {
                    alert("無法取得相機權限，請確認 iOS Safari 的相機權限已開啟。\n錯誤: " + err.message);
                } else {
                    alert("無法取得相機權限，請確保瀏覽器已允許此網站取用相機。\n錯誤: " + err.message);
                }
                btn.innerText = "重新開啟頂樓導覽";
            }
        }

        function startARSystem() {
            document.getElementById('permission-container').style.display = 'none';
            
            // 強迫 AR.js 重新計算並渲染網頁視窗
            window.dispatchEvent(new Event('resize'));
            
            // 安全地載入地標
            loadLandmarks();
        }

        function loadLandmarks() {
            const container = document.getElementById('landmark-container');
            
            // 加強防錯機制：如果真的找不到 container，在 console 報錯而不會讓整支程式卡死
            if (!container) {
                console.error("錯誤：找不到 #landmark-container 元素！網頁結構尚未載入完全。");
                return;
            }

            // 清空容器，避免重複載入
            container.innerHTML = "";

            buildingsData.forEach((bld) => {
                const entity = document.createElement('a-entity');
                entity.setAttribute('gps-entity-place', `latitude: ${bld.lat}; longitude: ${bld.lng};`);
                
                entity.setAttribute('text', {
                    value: bld.name,
                    align: 'center',
                    color: '#FFFFFF',
                    width: 8,
                    backgroundColor: '#FF3B30',
                    backgroundPadding: 0.3,
                    wrapCount: 12
                });
                
                entity.setAttribute('look-at', '[gps-camera]');
                entity.setAttribute('scale', '5 5 5');

                entity.addEventListener('click', () => {
                    showBuildingDetails(bld.name, bld.desc);
                });

                container.appendChild(entity);
            });
            console.log("地標資料已成功載入 AR 場景中。");
        }

        function showBuildingDetails(name, desc) {
            document.getElementById('building-name').innerText = name;
            document.getElementById('building-desc').innerText = desc;
            const overlay = document.getElementById('ui-overlay');
            overlay.style.display = 'block';
            overlay.onclick = () => { overlay.style.display = 'none'; };
        }
    </script>
</body>
</html>
